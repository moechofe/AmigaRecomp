name: dist

on:
  workflow_dispatch:
    inputs:
      games:
        description: Game ids to build, separated by spaces (nothing is released)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Debian 11's glibc; the Linux executable must need nothing newer.
  GLIBC_MAX: GLIBC_2.31
  # The oldest macOS the universal executable starts on; 11 is the first with arm64.
  MACOS_MIN: '11.0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      games: ${{ steps.games.outputs.games }}
      version: ${{ steps.games.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the games to build from the tag or the dispatch input
        id: games
        env:
          INPUT_GAMES: ${{ inputs.games }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            version=${tag%%-*}
            [[ $version =~ ^v[0-9]+(\.[0-9]+)*$ ]] || fail "tag $tag is not v<version>-<id>[-<id>...]"
            rest=${tag:${#version}}
            [ -n "$rest" ] || fail "tag $tag names no game: v<version>-<id>[-<id>...]"
            read -ra ids <<< "${rest//-/ }"
            tags=$(git ls-remote --tags --refs origin)
            while read -r _ ref; do
              other=${ref#refs/tags/}
              if [ "$other" != "$tag" ] && [ "${other%%-*}" = "$version" ]; then
                fail "version $version is already used by tag $other"
              fi
            done <<< "$tags"
          else
            version=
            read -ra ids <<< "$INPUT_GAMES"
          fi
          games=()
          for id in "${ids[@]}"; do
            [[ $id =~ ^[a-z0-9_]+$ ]] || fail "'$id' is not a game id"
            [ -f "games/$id/CMakeLists.txt" ] || fail "games/$id/CMakeLists.txt does not exist"
            for seen in "${games[@]}"; do
              [ "$seen" != "$id" ] || fail "$id is named twice"
            done
            games+=("$id")
          done
          [ "${#games[@]}" -gt 0 ] || fail "no game to build"
          echo "games: ${games[*]}"
          echo "version: $version"
          echo "games=$(printf '%s\n' "${games[@]}" | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: debian:11
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.prepare.outputs.games) }}
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    env:
      GAME: ${{ matrix.game }}
    steps:
      - name: Install the toolchain and SDL's build dependencies
        run: |
          # Debian 11 is past its LTS end; its packages are served from archive.debian.org.
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian bullseye-updates main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          apt-get update
          pkgs=(
            ca-certificates git build-essential binutils ninja-build pkg-config python3-pip
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
          )
          # apt asks for "+" in a file name as %2b. archive.debian.org's CDN answers 404 for either
          # spelling of "+" on an edge node that has not cached that one, so fetch what apt could
          # not by trying both, with perl (the only HTTP-capable tool in debian:11). apt verifies
          # the hashes when it installs from its cache.
          cat > /tmp/fetch.pl <<'EOF'
          use strict; use warnings; use IO::Socket::INET;
          my ($url, $dest) = @ARGV;
          (my $plain = $url) =~ s/%2b/+/gi;
          (my $escaped = $plain) =~ s/\+/%2b/g;
          my $error;
          for my $try ($plain, $escaped) {
            $try =~ m{^http://([^/]+)(/.*)$} or die "bad url $try\n";
            my ($host, $path) = ($1, $2);
            my $s = IO::Socket::INET->new(PeerAddr => "$host:80") or die "connect $host: $!\n";
            binmode $s;
            print $s "GET $path HTTP/1.0\r\nHost: $host\r\nConnection: close\r\n\r\n";
            my $reply = do { local $/; <$s> };
            my ($head, $body) = split /\r\n\r\n/, $reply, 2;
            if ($head !~ m{^HTTP/1\.\d 200 }) {
              $error = "$try: " . (split /\r\n/, $head)[0] . "\n";
              next;
            }
            open my $out, '>:raw', "$dest.part" or die "$dest: $!\n";
            print $out $body or die "$dest: $!\n";
            close $out or die "$dest: $!\n";
            rename "$dest.part", $dest or die "$dest: $!\n";
            exit 0;
          }
          die $error;
          EOF
          if ! apt-get install -y --no-install-recommends --download-only "${pkgs[@]}"; then
            apt-get install -y --no-install-recommends --print-uris "${pkgs[@]}" |
              sed -n "s/^'\([^']*\)' \([^ ]*\) .*/\1 \2/p" |
              while read -r url name; do
                [ -f "/var/cache/apt/archives/$name" ] || perl /tmp/fetch.pl "$url" "/var/cache/apt/archives/$name"
              done
          fi
          apt-get install -y --no-install-recommends "${pkgs[@]}"
          python3 -m pip install 'cmake>=3.24'
          cmake --version
          gcc --version
          ninja --version

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S "games/$GAME" -B "games/$GAME/build/cmake-linux" -G Ninja
          cmake --build "games/$GAME/build/cmake-linux"

      - name: Test
        run: ctest --test-dir "games/$GAME/build/cmake-linux" --output-on-failure

      - name: Check shared libraries and the glibc floor
        run: |
          exe="games/$GAME/build/cmake-linux/$GAME"
          ldd "$exe"
          extra=$(ldd "$exe" | grep -vE '^[[:space:]]*((linux-vdso|libm|libc|libdl|libpthread)\.so|/lib64/ld-linux-x86-64\.so|(/lib/)?ld-linux-aarch64\.so)' || true)
          if [ -n "$extra" ]; then
            echo "::error::unexpected shared libraries:"
            echo "$extra"
            exit 1
          fi
          floor=$(objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "glibc floor: $floor"
          if [ "$(printf '%s\n' "$floor" "$GLIBC_MAX" | sort -V | tail -n1)" != "$GLIBC_MAX" ]; then
            echo "::error::glibc floor $floor is above $GLIBC_MAX"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-linux-${{ matrix.arch }}-build
          path: games/${{ matrix.game }}/build/cmake-linux/${{ matrix.game }}
          retention-days: 1
          if-no-files-found: error

  linux-run:
    needs: [prepare, appimage]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.prepare.outputs.games) }}
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    env:
      GAME: ${{ matrix.game }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.game }}-linux-${{ matrix.arch }}-appimage
          path: run

      - name: Start the AppImage with no disks on a machine without a compiler or Python
        working-directory: run
        run: |
          if command -v gcc cc python3; then
            echo "::error::this image has a compiler or Python"
            exit 1
          fi
          [ "$(uname -m)" = "$ARCH" ]
          app="$GAME-linux-$ARCH.AppImage"
          chmod +x "$app"
          set +e
          env -i PATH=/usr/bin:/bin HOME="$PWD" APPIMAGE_EXTRACT_AND_RUN=1 "./$app" --headless --pref ./pref 2> err.txt
          code=$?
          set -e
          cat err.txt
          echo "exit code: $code"
          [ "$code" = 2 ] && grep -q ' is missing: ' err.txt

  windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.prepare.outputs.games) }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: gcc:p cmake:p ninja:p

      - name: Toolchain versions
        run: |
          cmake --version
          gcc --version
          ninja --version

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S "games/$GAME" -B "games/$GAME/build/cmake" -G Ninja
          cmake --build "games/$GAME/build/cmake"

      - name: Test
        run: ctest --test-dir "games/$GAME/build/cmake" --output-on-failure

      - name: Check imported DLLs
        run: |
          dlls=$(objdump -p "games/$GAME/build/cmake/$GAME.exe" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr '[:upper:]' '[:lower:]' | sort -u)
          echo "$dlls"
          extra=$(echo "$dlls" | grep -vxE '(advapi32|gdi32|imm32|kernel32|ole32|oleaut32|setupapi|shell32|user32|version|winmm|api-ms-win-crt-[a-z0-9-]+)\.dll' || true)
          if [ -n "$extra" ]; then
            echo "::error::unexpected DLLs:"
            echo "$extra"
            exit 1
          fi

      - name: Start with no disks and a PATH that holds only Windows
        shell: pwsh
        run: |
          $exe = Resolve-Path "games/$env:GAME/build/cmake/$env:GAME.exe"
          $err = "$env:RUNNER_TEMP\err.txt"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath $exe -ArgumentList '--headless', '--pref', "$env:RUNNER_TEMP\pref" -Wait -PassThru -RedirectStandardError $err
          Get-Content $err
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 2 -or -not (Select-String -Quiet -SimpleMatch ' is missing: ' $err)) { exit 1 }

      - name: Name the release asset
        run: cp "games/$GAME/build/cmake/$GAME.exe" "$GAME-windows-x86_64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-windows
          path: ${{ matrix.game }}-windows-x86_64.exe
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.prepare.outputs.games) }}
    env:
      GAME: ${{ matrix.game }}
    steps:
      - name: Install the toolchain
        run: |
          brew install ninja
          cmake --version
          clang --version
          ninja --version

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S "games/$GAME" -B "games/$GAME/build/cmake-macos" -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN"
          cmake --build "games/$GAME/build/cmake-macos"

      - name: Test
        run: ctest --test-dir "games/$GAME/build/cmake-macos" --output-on-failure

      - name: Check architectures, the macOS floor and linked libraries
        run: |
          exe="games/$GAME/build/cmake-macos/$GAME"
          archs=$(lipo -archs "$exe")
          echo "architectures: $archs"
          if [ "$archs" != "x86_64 arm64" ]; then
            echo "::error::expected x86_64 arm64"
            exit 1
          fi
          floor=$(vtool -show-build "$exe" | awk '$1 == "minos" { print $2 }' | sort -u)
          echo "macOS floor: $floor"
          if [ "$floor" != "$MACOS_MIN" ]; then
            echo "::error::macOS floor $floor is not $MACOS_MIN"
            exit 1
          fi
          libs=$(otool -L "$exe" | awk '/^\t/ { print $1 }' | sort -u)
          echo "$libs"
          extra=$(echo "$libs" | grep -vE '^(/System/Library/Frameworks/[A-Za-z]+\.framework/|/usr/lib/lib(System\.B|c\+\+\.1|objc\.A)\.dylib$)' || true)
          if [ -n "$extra" ]; then
            echo "::error::unexpected shared libraries:"
            echo "$extra"
            exit 1
          fi

      - name: Start with no disks
        run: |
          set +e
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" "games/$GAME/build/cmake-macos/$GAME" --headless --pref "$RUNNER_TEMP/pref" 2> err.txt
          code=$?
          set -e
          cat err.txt
          echo "exit code: $code"
          [ "$code" = 2 ] && grep -q ' is missing: ' err.txt

      - name: Pack the application bundle
        run: |
          python3 tools/macapp.py --game "$GAME"
          codesign --verify --deep --strict --verbose=2 "games/$GAME/build/dist/macos/$GAME.app"
          plutil -p "games/$GAME/build/dist/macos/$GAME.app/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-macos
          path: games/${{ matrix.game }}/build/dist/macos/${{ matrix.game }}-macos-universal.zip
          if-no-files-found: error

  macos-run:
    needs: [prepare, macos]
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.prepare.outputs.games) }}
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.game }}-macos
          path: run

      - name: Start the x86_64 half of the release asset with no disks, directly and through LaunchServices
        working-directory: run
        run: |
          uname -m
          [ "$(uname -m)" = x86_64 ]
          ditto -x -k "$GAME-macos-universal.zip" .
          set +e
          env -i PATH=/usr/bin:/bin HOME="$PWD" "./$GAME.app/Contents/MacOS/$GAME" --headless --pref ./pref 2> err.txt
          code=$?
          set -e
          cat err.txt
          echo "exit code: $code"
          [ "$code" = 2 ]
          grep -q ' is missing: ' err.txt
          # open -W cannot wait for a process that has already exited, so wait for its message.
          open -n --stderr "$PWD/open-err.txt" "./$GAME.app" --args --headless --pref "$PWD/open-pref"
          for i in $(seq 30); do grep -q ' is missing: ' open-err.txt 2>/dev/null && break; sleep 1; done
          cat open-err.txt
          grep -q ' is missing: ' open-err.txt

  appimage:
    needs: [prepare, linux]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.prepare.outputs.games) }}
        arch: [x86_64, aarch64]
    env:
      GAME: ${{ matrix.game }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.game }}-linux-${{ matrix.arch }}-build
          path: games/${{ matrix.game }}/build/cmake-linux

      - name: Install appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Validate the desktop entry
        run: desktop-file-validate "games/$GAME/packaging/$GAME.desktop"

      - name: Pack
        run: python3 tools/appimage.py --game "$GAME" --arch "$ARCH" --tool "$RUNNER_TEMP/appimagetool"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-linux-${{ matrix.arch }}-appimage
          path: games/${{ matrix.game }}/build/dist/linux/${{ matrix.game }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, appimage, linux-run, windows, macos-run]
    runs-on: ubuntu-24.04
    # Each release copies from the latest one, so two must never be made at once.
    concurrency:
      group: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GAMES: ${{ join(fromJSON(needs.prepare.outputs.games), ' ') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            release/note.md
            games/*/packaging/*.desktop
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-{appimage,windows,macos}'
          merge-multiple: true
          path: assets

      - name: List the files built here in the manifest
        run: |
          for game in $GAMES; do
            for file in "$game-windows-x86_64.exe" "$game-linux-x86_64.AppImage" "$game-linux-aarch64.AppImage" "$game-macos-universal.zip"; do
              if [ ! -f "assets/$file" ]; then
                echo "::error::$file was not built"
                exit 1
              fi
            done
          done
          for path in assets/*; do
            echo "$(sha256sum "$path" | cut -d' ' -f1) ${path#assets/} $TAG $GITHUB_SHA"
          done > "$RUNNER_TEMP/manifest.txt"

      - name: Copy the other games' files from the latest release
        run: |
          if ! prev=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2> "$RUNNER_TEMP/latest-err.txt"); then
            cat "$RUNNER_TEMP/latest-err.txt"
            grep -q 'HTTP 404' "$RUNNER_TEMP/latest-err.txt"
            echo "no release yet: nothing to copy"
            exit 0
          fi
          echo "latest release: $prev"
          gh release download "$prev" --repo "$REPO" --dir "$RUNNER_TEMP/prev"
          old="$RUNNER_TEMP/prev/manifest.txt"
          if [ ! -f "$old" ]; then
            # A release from before the manifest: every file was built from its tag's commit.
            commit=$(gh api "repos/$REPO/commits/$prev" --jq .sha)
            old="$RUNNER_TEMP/prev-manifest.txt"
            for path in "$RUNNER_TEMP"/prev/*; do
              echo "$(sha256sum "$path" | cut -d' ' -f1) ${path##*/} $prev $commit"
            done > "$old"
          fi
          for path in "$RUNNER_TEMP"/prev/*; do
            file=${path##*/}
            [ "$file" != manifest.txt ] || continue
            case " $GAMES " in *" ${file%%-*} "*) continue ;; esac
            line=$(awk -v file="$file" '$2 == file' "$old")
            if [ -z "$line" ]; then
              echo "::error::$prev's manifest has no line for $file"
              exit 1
            fi
            if [ "$(sha256sum "$path" | cut -d' ' -f1)" != "${line%% *}" ]; then
              echo "::error::$file does not match $prev's manifest"
              exit 1
            fi
            cp "$path" assets/
            echo "$line" >> "$RUNNER_TEMP/manifest.txt"
          done

      - name: Publish
        run: |
          sort -k2 "$RUNNER_TEMP/manifest.txt" > assets/manifest.txt
          cat assets/manifest.txt
          titles=()
          for game in $GAMES; do
            titles+=("$(sed -n 's/^Name=//p' "games/$game/packaging/$game.desktop")")
          done
          REBUILT=$(printf '%s, ' "${titles[@]}")
          export REBUILT=${REBUILT%, }
          envsubst '$TAG $REPO $REBUILT' < release/note.md > "$RUNNER_TEMP/note.md"
          ls -l assets
          # A draft stays hidden until every file is uploaded.
          gh release create "$TAG" assets/* --repo "$REPO" --draft --title "$VERSION" --notes-file "$RUNNER_TEMP/note.md" --generate-notes
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
